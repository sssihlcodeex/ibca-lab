[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibca-core"
dynamic = ["version"]
description = "Research library of the Identifiable Bio-Imaging & Clinical AI Lab (IBCA Lab)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IBCA Lab", email = "saipradyumnat@codeex.space" }]
keywords = ["bio-imaging", "representation-learning", "reproducibility", "clinical-ai"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://ibca.codeex.space/"
Repository = "https://github.com/sssihlcodeex/ibca-lab"

[tool.setuptools.dynamic]
version = { attr = "ibca_core.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
